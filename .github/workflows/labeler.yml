name: Labeler

on:
  issues:
    types: [opened, edited, milestoned]
  pull_request_target:
    types: [opened, edited, synchronize]

# 조직·저장소의 기본 워크플로 토큰이 읽기 전용이라, 라벨을 붙이려면 여기서 쓰기 권한을 준다
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: fuxingloh/multi-labeler@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
